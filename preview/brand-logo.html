<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  * { box-sizing:border-box; margin:0; }
  body { background:#000711; padding:20px; display:flex; flex-direction:column; gap:16px; }
  .row { display:flex; gap:16px; align-items:center; }
  .panel { padding:20px 28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:1; }
  img { max-width:100%; max-height:60px; }
  .lbl { font-family:sans-serif; font-size:9px; text-transform:uppercase; letter-spacing:0.12em; color:rgba(255,255,255,0.25); }
</style></head><body>
  <div class="row">
    <div class="panel" style="background:#ffffff">
      <img src="../assets/logo.png" alt="Suhit Amin Logo">
    </div>
    <div class="panel" style="background:#000711;border:1px solid rgba(255,255,255,0.1)">
      <img src="../assets/logo.png" style="filter:invert(1)" alt="Suhit Amin Logo Inverted">
    </div>
  </div>
  <div class="row" style="gap:24px">
    <span class="lbl">On white (default)</span>
    <span class="lbl">On dark (filter:invert)</span>
  </div>
</body></html>
