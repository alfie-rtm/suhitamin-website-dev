<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Saira:wght@400;600&display=swap');
  * { box-sizing: border-box; margin: 0; }
  body { background: #111; font-family: 'Saira', sans-serif; padding: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .swatch { flex: 1; height: 72px; border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; }
  .swatch-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); }
  .swatch-hex { font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.35); margin-top: 2px; }
  .swatch-label.dark { color: rgba(0,0,0,0.5); }
  .swatch-hex.dark { color: rgba(0,0,0,0.35); }
</style></head><body>
<div class="row">
  <div class="swatch" style="background:#000711">
    <span class="swatch-label">Background</span><span class="swatch-hex">#000711</span>
  </div>
  <div class="swatch" style="background:#0a1018">
    <span class="swatch-label">BG Alt</span><span class="swatch-hex">#0a1018</span>
  </div>
  <div class="swatch" style="background:#0a1530">
    <span class="swatch-label">BG Gradient</span><span class="swatch-hex">#0a1530</span>
  </div>
  <div class="swatch" style="background:#151a1e">
    <span class="swatch-label">Surface</span><span class="swatch-hex">#151a1e</span>
  </div>
</div>
<div class="row">
  <div class="swatch" style="background:#0066ff">
    <span class="swatch-label">Accent</span><span class="swatch-hex">#0066ff</span>
  </div>
  <div class="swatch" style="background:#5694ff">
    <span class="swatch-label">Accent Soft</span><span class="swatch-hex">#5694ff</span>
  </div>
  <div class="swatch" style="background:#eff5ff">
    <span class="swatch-label dark">Accent Pale</span><span class="swatch-hex dark">#eff5ff</span>
  </div>
  <div class="swatch" style="background:#f2f4f8">
    <span class="swatch-label dark">Surface Light</span><span class="swatch-hex dark">#f2f4f8</span>
  </div>
  <div class="swatch" style="background:#ffffff">
    <span class="swatch-label dark">Foreground</span><span class="swatch-hex dark">#ffffff</span>
  </div>
</div>
</body></html>
