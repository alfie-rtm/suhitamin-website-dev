<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  @font-face { font-family:'Saira'; src:url('../fonts/Saira-VariableFont.ttf') format('truetype'); font-weight:100 900; }
  * { box-sizing:border-box; margin:0; }
  body { background:#000711; font-family:'Saira',sans-serif; padding:14px; display:flex; flex-direction:column; gap:10px; }

  .row { display:flex; gap:10px; }
  .tile { display:flex; flex-direction:column; gap:5px; flex:1; }
  .surface { width:100%; height:64px; display:flex; align-items:center; justify-content:center;
    font-size:10px; color:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.14);
    border-radius:2px; font-family:'Saira',sans-serif; background:#000711; }
  .lbl { font-size:9px; text-transform:uppercase; letter-spacing:0.12em; color:rgba(255,255,255,0.28); }
  .sub { font-size:9px; color:rgba(255,255,255,0.16); }

  /* Blob containers */
  .blob-box { width:100%; height:72px; position:relative; overflow:hidden; border-radius:2px; background:#000711; border:1px solid rgba(255,255,255,0.08); }

  /* Variation A — bilateral blue, large */
  .blobA-l { position:absolute; width:160px; height:160px; border-radius:50%;
    background:radial-gradient(circle, rgba(0,102,255,0.55) 0%, transparent 68%);
    top:50%; left:-20px; transform:translateY(-50%);
    animation: floatAL 8s ease-in-out infinite; }
  .blobA-r { position:absolute; width:160px; height:160px; border-radius:50%;
    background:radial-gradient(circle, rgba(0,102,255,0.40) 0%, transparent 68%);
    top:50%; right:-20px; transform:translateY(-50%);
    animation: floatAR 10s ease-in-out infinite; }
  @keyframes floatAL {
    0%,100% { transform:translateY(-50%) scale(1);   opacity:.85; }
    45%      { transform:translateY(-60%) scale(1.12); opacity:.6; }
  }
  @keyframes floatAR {
    0%,100% { transform:translateY(-50%) scale(1);   opacity:.7; }
    55%      { transform:translateY(-42%) scale(1.08); opacity:.5; }
  }

  /* Variation B — asymmetric blue + soft teal */
  .blobB-1 { position:absolute; width:200px; height:200px; border-radius:50%;
    background:radial-gradient(circle, rgba(0,80,255,0.50) 0%, transparent 65%);
    top:50%; left:50%; transform:translate(-70%,-50%);
    animation: floatB1 9s ease-in-out infinite; }
  .blobB-2 { position:absolute; width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle, rgba(86,148,255,0.45) 0%, transparent 65%);
    top:20%; right:10%; animation: floatB2 6s ease-in-out infinite; }
  @keyframes floatB1 {
    0%,100% { transform:translate(-70%,-50%) scale(1); }
    50%      { transform:translate(-65%,-60%) scale(1.1); }
  }
  @keyframes floatB2 {
    0%,100% { transform:scale(1); opacity:.7; }
    50%      { transform:scale(1.2); opacity:.45; }
  }

  /* Variation C — triple, scattered */
  .blobC-1 { position:absolute; width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle, rgba(0,102,255,0.45) 0%, transparent 65%);
    top:50%; left:-30px; transform:translateY(-50%);
    animation: floatC1 11s ease-in-out infinite; }
  .blobC-2 { position:absolute; width:130px; height:130px; border-radius:50%;
    background:radial-gradient(circle, rgba(86,148,255,0.35) 0%, transparent 65%);
    top:10%; left:50%; transform:translateX(-50%);
    animation: floatC2 7s ease-in-out infinite; }
  .blobC-3 { position:absolute; width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle, rgba(0,60,200,0.40) 0%, transparent 65%);
    bottom:-30px; right:-20px; animation: floatC3 9s ease-in-out infinite; }
  @keyframes floatC1 { 0%,100%{transform:translateY(-50%) scale(1)} 50%{transform:translateY(-58%) scale(1.08)} }
  @keyframes floatC2 { 0%,100%{transform:translateX(-50%) scale(1); opacity:.7} 50%{transform:translateX(-45%) scale(1.15); opacity:.5} }
  @keyframes floatC3 { 0%,100%{transform:scale(1); opacity:.65} 50%{transform:scale(1.1); opacity:.45} }
</style></head><body>

  <!-- Surfaces row -->
  <div class="row">
    <div class="tile">
      <div class="surface">Card Default</div>
      <div class="lbl">Base Tile</div><div class="sub">#000711 + border/14</div>
    </div>
    <div class="tile">
      <div class="surface" style="background:#0a1530;border-color:rgba(0,102,255,0.22)">Card Hover</div>
      <div class="lbl">Hover State</div><div class="sub">#0a1530</div>
    </div>
    <div class="tile">
      <div class="surface" style="background:linear-gradient(135deg,#060d1a,#000711);border-color:rgba(255,255,255,0.18)">Quote Card</div>
      <div class="lbl">Testimonial</div><div class="sub">gradient</div>
    </div>
    <div class="tile">
      <div class="surface" style="background:rgba(255,255,255,0.06);backdrop-filter:blur(8px);border-color:rgba(255,255,255,0.20)">Blur Tile</div>
      <div class="lbl">Nav / Stage</div><div class="sub">white/6 + blur</div>
    </div>
  </div>

  <!-- Blob variations -->
  <div class="row">
    <div class="tile">
      <div class="blob-box"><div class="blobA-l"></div><div class="blobA-r"></div></div>
      <div class="lbl">Blob A — Bilateral</div><div class="sub">Hero / Speaking sections</div>
    </div>
    <div class="tile">
      <div class="blob-box"><div class="blobB-1"></div><div class="blobB-2"></div></div>
      <div class="lbl">Blob B — Asymmetric</div><div class="sub">Story / Newsletter</div>
    </div>
    <div class="tile">
      <div class="blob-box"><div class="blobC-1"></div><div class="blobC-2"></div><div class="blobC-3"></div></div>
      <div class="lbl">Blob C — Triple</div><div class="sub">Full-bleed backgrounds</div>
    </div>
  </div>

</body></html>
