<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  @font-face { font-family:'Saira'; src:url('../fonts/Saira-VariableFont.ttf') format('truetype'); font-weight:100 900; }
  * { box-sizing:border-box; margin:0; }
  body { background:#000711; font-family:'Saira',sans-serif; padding:20px; }
  .row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .bar { background:#0066ff; height:10px; border-radius:0; }
  .lbl { font-size:10px; color:rgba(255,255,255,0.4); width:60px; flex-shrink:0; }
  .val { font-size:10px; color:rgba(255,255,255,0.25); }
  .divider { height:1px; background:rgba(255,255,255,0.06); margin:14px 0; }
  .radius-row { display:flex; gap:12px; align-items:flex-end; }
  .radius-demo { background:#151a1e; border:1px solid rgba(255,255,255,0.1); width:64px; height:40px; }
  .rlbl { font-size:9px; color:rgba(255,255,255,0.3); text-align:center; margin-top:6px; white-space:nowrap; }
  .section-lbl { font-size:9px; text-transform:uppercase; letter-spacing:0.15em; color:rgba(255,255,255,0.25); margin-bottom:10px; }
</style></head><body>

  <div class="section-lbl">Space Scale</div>
  <div class="row"><span class="lbl">space-2</span><div class="bar" style="width:8px"></div><span class="val">8px</span></div>
  <div class="row"><span class="lbl">space-4</span><div class="bar" style="width:16px"></div><span class="val">16px</span></div>
  <div class="row"><span class="lbl">space-6</span><div class="bar" style="width:24px"></div><span class="val">24px</span></div>
  <div class="row"><span class="lbl">space-8</span><div class="bar" style="width:32px"></div><span class="val">32px</span></div>
  <div class="row"><span class="lbl">space-12</span><div class="bar" style="width:48px"></div><span class="val">48px</span></div>
  <div class="row"><span class="lbl">space-16</span><div class="bar" style="width:64px"></div><span class="val">64px</span></div>
  <div class="row"><span class="lbl">space-32</span><div class="bar" style="width:128px"></div><span class="val">128px — section py</span></div>

  <div class="divider"></div>
  <div class="section-lbl">Border Radius — Angular System</div>
  <div class="radius-row">
    <div>
      <div class="radius-demo" style="border-radius:2px"></div>
      <div class="rlbl">2px<br>Cards / Tiles</div>
    </div>
    <div>
      <div class="radius-demo" style="border-radius:2px"></div>
      <div class="rlbl">2px<br>Tags / Inputs</div>
    </div>
    <div>
      <div class="radius-demo" style="width:88px;border-radius:2px"></div>
      <div class="rlbl">2px<br>Buttons</div>
    </div>
  </div>
  <div style="margin-top:12px;font-size:10px;color:rgba(255,255,255,0.25);font-style:italic">
    Minimum radius: 2px. Sharp, angular geometry throughout — no pill shapes.
  </div>

</body></html>
